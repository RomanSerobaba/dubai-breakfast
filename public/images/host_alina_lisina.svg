<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071324" />
      <stop offset="40%" stop-color="#0E223F" />
      <stop offset="80%" stop-color="#1A3A63" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#E06D2B" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#A54019" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#071324" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0A0" />
      <stop offset="50%" stop-color="#E06D2B" />
      <stop offset="100%" stop-color="#B24F18" />
    </linearGradient>

    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142C4C" />
      <stop offset="50%" stop-color="#0B1A30" />
      <stop offset="100%" stop-color="#06101E" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1D0" />
      <stop offset="60%" stop-color="#EAC0A6" />
      <stop offset="100%" stop-color="#D4A182" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bgGrad)" rx="24" />
  <rect width="800" height="1000" fill="url(#haloGlow)" rx="24" />

  <!-- Subtle Architectural Grid Background -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="1000" />
    <line x1="250" y1="0" x2="250" y2="1000" />
    <line x1="400" y1="0" x2="400" y2="1000" />
    <line x1="550" y1="0" x2="550" y2="1000" />
    <line x1="700" y1="0" x2="700" y2="1000" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="800" x2="800" y2="800" />
  </g>

  <!-- Dubai Skyline Silhouette in Background Window -->
  <g fill="#0B192C" opacity="0.6">
    <polygon points="120,480 150,440 180,480 180,600 120,600" />
    <rect x="220" y="420" width="50" height="180" />
    <polygon points="220,420 245,380 270,420" />
    <rect x="540" y="450" width="60" height="150" />
    <rect x="620" y="410" width="70" height="190" />
    <polygon points="620,410 655,360 690,410" />
  </g>

  <!-- Decorative Outer Glow Ring -->
  <circle cx="400" cy="380" r="230" fill="none" stroke="url(#goldRim)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 6" />
  <circle cx="400" cy="380" r="215" fill="none" stroke="#E06D2B" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Speaker Portrait Art: Alina Lisina Stylized Editorial Representation -->
  <!-- Hair Base Silhouette -->
  <path d="M 280 340 C 270 230, 340 170, 400 170 C 460 170, 530 230, 520 340 C 520 420, 510 500, 480 540 C 470 480, 470 380, 460 350 C 440 320, 360 320, 340 350 C 330 380, 330 480, 320 540 C 290 500, 280 420, 280 340 Z" fill="#201A18" />

  <!-- Neck & Face -->
  <path d="M 370 390 L 370 460 C 370 475, 430 475, 430 460 L 430 390 Z" fill="url(#skinGrad)" />
  <ellipse cx="400" cy="330" rx="75" ry="95" fill="url(#skinGrad)" />

  <!-- Modern Hairline Over Face -->
  <path d="M 330 290 C 350 240, 430 230, 470 280 C 460 250, 400 240, 340 260 Z" fill="#2E2421" />

  <!-- Elegant Features & Warm Expression -->
  <path d="M 360 310 Q 375 305 388 312" fill="none" stroke="#543C33" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 412 312 Q 425 305 440 310" fill="none" stroke="#543C33" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="375" cy="325" r="5" fill="#3D2922" />
  <circle cx="425" cy="325" r="5" fill="#3D2922" />
  <path d="M 397 335 L 402 355 L 396 357" fill="none" stroke="#BA8568" stroke-width="2" stroke-linecap="round" />
  <path d="M 382 375 Q 400 390 418 375" fill="none" stroke="#A84C32" stroke-width="3" stroke-linecap="round" />

  <!-- Shoulders & Executive Tailored Blazer -->
  <path d="M 230 680 C 250 540, 320 480, 370 470 L 400 520 L 430 470 C 480 480, 550 540, 570 680 L 630 1000 L 170 1000 Z" fill="url(#blazerGrad)" stroke="#1E3A5F" stroke-width="2" />
  
  <!-- Blazer Lapels & Silk Shirt Collar -->
  <path d="M 370 470 L 400 590 L 350 720 L 310 650 Z" fill="#183459" stroke="#E06D2B" stroke-width="1" stroke-opacity="0.3" />
  <path d="M 430 470 L 400 590 L 450 720 L 490 650 Z" fill="#112744" stroke="#E06D2B" stroke-width="1" stroke-opacity="0.3" />
  <polygon points="385,470 415,470 400,530" fill="#F8F6F0" />

  <!-- Gold Brooch / Pin: Blue White Emblem -->
  <circle cx="340" cy="560" r="10" fill="url(#goldRim)" />
  <circle cx="340" cy="560" r="6" fill="#0A192F" />

  <!-- Bottom Frosted Info Plaque -->
  <g transform="translate(80, 810)">
    <rect width="640" height="140" rx="20" fill="#071324" fill-opacity="0.85" stroke="#1E3A5F" stroke-width="1.5" />
    
    <!-- Monogram Circle -->
    <circle cx="70" cy="70" r="42" fill="#E06D2B" fill-opacity="0.15" stroke="#E06D2B" stroke-width="1.5" />
    <text x="70" y="77" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#E06D2B" text-anchor="middle">АЛ</text>

    <!-- Name & Role -->
    <text x="135" y="55" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Алина Лисина</text>
    <text x="135" y="82" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Основатель агентства Blue White · 20 лет в B2B</text>
    <text x="135" y="104" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E06D2B">Практикующий стратег high-ticket продаж</text>

    <!-- Verified Pill Badge -->
    <g transform="translate(500, 38)">
      <rect width="115" height="30" rx="15" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" />
      <circle cx="20" cy="15" r="5" fill="#10B981" />
      <text x="32" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">ВЕДУЩАЯ</text>
    </g>
  </g>
</svg>
