<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050C16" />
      <stop offset="35%" stop-color="#0A192F" />
      <stop offset="65%" stop-color="#142C4E" />
      <stop offset="85%" stop-color="#4A261B" />
      <stop offset="95%" stop-color="#8C3F1B" />
      <stop offset="100%" stop-color="#E06D2B" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="62%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#FFD188" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#E06D2B" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#A54019" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="burjGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1422" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#172A45" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A1422" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="towerGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A3355" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glassFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#071324" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#040911" stop-opacity="0.98" />
    </linearGradient>

    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <rect width="1920" height="1080" fill="url(#sunGlow)" />

  <!-- Stars / Ambient dust in upper sky -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="150" cy="90" r="1.5" />
    <circle cx="280" cy="140" r="1" />
    <circle cx="420" cy="80" r="1.2" />
    <circle cx="750" cy="110" r="1.5" />
    <circle cx="980" cy="70" r="1" />
    <circle cx="1250" cy="130" r="1.2" />
    <circle cx="1450" cy="85" r="1.5" />
    <circle cx="1720" cy="120" r="1" />
    <circle cx="1840" cy="60" r="1.8" />
  </g>

  <!-- Far Distant Skyline Silhouette (Layer 1) -->
  <g fill="url(#towerGradFar)" opacity="0.45">
    <rect x="180" y="520" width="45" height="300" />
    <polygon points="180,520 202,480 225,520" />
    <rect x="240" y="560" width="70" height="260" />
    <rect x="330" y="490" width="55" height="330" />
    <rect x="410" y="540" width="80" height="280" />
    <polygon points="410,540 450,460 490,540" />
    <rect x="520" y="510" width="60" height="310" />
    
    <rect x="740" y="530" width="65" height="290" />
    <rect x="820" y="470" width="50" height="350" />
    <polygon points="820,470 845,430 870,470" />
    <rect x="890" y="510" width="90" height="310" />

    <rect x="1350" y="530" width="85" height="290" />
    <rect x="1460" y="480" width="70" height="340" />
    <polygon points="1460,480 1495,420 1530,480" />
    <rect x="1550" y="540" width="60" height="280" />
    <rect x="1630" y="500" width="75" height="320" />
    <rect x="1720" y="550" width="90" height="270" />
  </g>

  <!-- Mid Skyline with DIFC / Sheikh Zayed Towers (Layer 2) -->
  <g fill="#0E2138" opacity="0.85">
    <rect x="90" y="580" width="70" height="260" />
    <rect x="620" y="480" width="75" height="360" />
    <polygon points="620,480 657,390 695,480" />
    
    <!-- Emirates Towers / DIFC gate archetype -->
    <rect x="710" y="440" width="85" height="400" />
    <polygon points="710,440 752,360 795,440" />
    <line x1="752" y1="360" x2="752" y2="310" stroke="#FFD188" stroke-width="2" opacity="0.6" />
    
    <rect x="980" y="460" width="95" height="380" />
    <rect x="1090" y="510" width="75" height="330" />
    <polygon points="1090,510 1127,450 1165,510" />

    <rect x="1410" y="430" width="90" height="410" />
    <polygon points="1410,430 1455,350 1500,430" />
    <rect x="1520" y="490" width="80" height="350" />
  </g>

  <!-- Iconic Centerpiece: Burj Khalifa Silhouette (Layer 3) -->
  <g id="burj_khalifa">
    <!-- Spire top beacon -->
    <circle cx="1230" cy="120" r="3" fill="#FFE3A8" />
    <circle cx="1230" cy="120" r="14" fill="#FFE3A8" opacity="0.3" />
    <line x1="1230" y1="120" x2="1230" y2="280" stroke="#FFE3A8" stroke-width="2.5" />
    
    <!-- Tiered Tower Architecture -->
    <polygon points="1225,280 1235,280 1237,360 1223,360" fill="url(#burjGrad)" />
    <polygon points="1220,360 1240,360 1243,450 1217,450" fill="url(#burjGrad)" />
    <polygon points="1213,450 1247,450 1252,540 1208,540" fill="url(#burjGrad)" />
    <polygon points="1202,540 1258,540 1264,640 1196,640" fill="url(#burjGrad)" />
    <polygon points="1188,640 1272,640 1280,750 1180,750" fill="url(#burjGrad)" />
    <polygon points="1170,750 1290,750 1300,840 1160,840" fill="url(#burjGrad)" />

    <!-- Sleek tower light reflections -->
    <line x1="1230" y1="280" x2="1230" y2="840" stroke="#FFE3A8" stroke-width="1.5" stroke-opacity="0.35" />
    <line x1="1220" y1="450" x2="1220" y2="840" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" />
    <line x1="1240" y1="450" x2="1240" y2="840" stroke="#FF9C55" stroke-width="1" stroke-opacity="0.25" />
  </g>

  <!-- Glowing Architectural Windows in Skyscrapers -->
  <g fill="#FFE8BF" opacity="0.4">
    <!-- Tower 1 -->
    <rect x="725" y="480" width="3" height="4" />
    <rect x="735" y="480" width="3" height="4" />
    <rect x="755" y="480" width="3" height="4" />
    <rect x="725" y="520" width="3" height="4" />
    <rect x="745" y="520" width="3" height="4" />
    <rect x="725" y="560" width="3" height="4" />
    <rect x="755" y="560" width="3" height="4" />

    <!-- Tower 2 -->
    <rect x="1000" y="500" width="3" height="5" />
    <rect x="1020" y="500" width="3" height="5" />
    <rect x="1040" y="500" width="3" height="5" />
    <rect x="1000" y="530" width="3" height="5" />
    <rect x="1030" y="530" width="3" height="5" />
    <rect x="1010" y="570" width="3" height="5" />
    <rect x="1040" y="570" width="3" height="5" />

    <!-- Burj Khalifa windows -->
    <rect x="1228" y="380" width="4" height="2" />
    <rect x="1228" y="410" width="4" height="2" />
    <rect x="1225" y="490" width="10" height="2" />
    <rect x="1220" y="570" width="20" height="2" />
    <rect x="1215" y="660" width="30" height="2" />
  </g>

  <!-- Golden Sunrise Horizon Glow & Mist -->
  <ellipse cx="1230" cy="800" rx="600" ry="90" fill="#FF8D3B" opacity="0.3" filter="blur(30px)" />
  <ellipse cx="600" cy="820" rx="500" ry="70" fill="#FF8D3B" opacity="0.2" filter="blur(30px)" />

  <!-- Floor to Ceiling Penthouse / Boardroom Glass Structure In Foreground -->
  <!-- Subtle Grid Overlay -->
  <rect width="1920" height="1080" fill="url(#gridPattern)" />

  <!-- Modern Luxury Minimalist Boardroom Mullions / Window Frames -->
  <g stroke="#1E3A5F" stroke-width="4" opacity="0.45">
    <line x1="0" y1="840" x2="1920" y2="840" stroke-width="6" />
    <line x1="480" y1="0" x2="480" y2="840" />
    <line x1="960" y1="0" x2="960" y2="840" />
    <line x1="1440" y1="0" x2="1440" y2="840" />
  </g>

  <!-- Dark Atmospheric Gradient Fog in Foreground -->
  <rect y="720" width="1920" height="360" fill="url(#glassFloor)" />
  <rect y="840" width="1920" height="240" fill="#0A192F" opacity="0.9" />

  <!-- Penthouse Boardroom Round Marble Table Silhouette in Foreground -->
  <ellipse cx="960" cy="1060" rx="720" ry="160" fill="#06101D" stroke="#E06D2B" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Subtle warm ambient rim on the table edge -->
  <path d="M 320 1050 Q 960 920 1600 1050" fill="none" stroke="#E06D2B" stroke-width="2.5" stroke-opacity="0.6" />
</svg>
