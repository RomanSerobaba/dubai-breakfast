<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="galBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081425" />
      <stop offset="100%" stop-color="#040913" />
    </linearGradient>

    <linearGradient id="photoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D2B" />
      <stop offset="100%" stop-color="#1E3A5F" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#galBg)" rx="20" />

  <!-- Grid of Event Moments -->
  <!-- Top Left: Mastermind Table Discussion -->
  <g transform="translate(40, 40)">
    <rect width="540" height="340" rx="16" fill="#0C1D33" stroke="#1E3A5F" stroke-width="1.5" />
    <!-- Table scene -->
    <ellipse cx="270" cy="220" rx="200" ry="80" fill="#142B47" stroke="#E06D2B" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="160" cy="180" r="16" fill="#3A5375" />
    <circle cx="270" cy="165" r="18" fill="#E06D2B" />
    <circle cx="380" cy="180" r="16" fill="#3A5375" />
    
    <!-- Tag -->
    <rect x="20" y="20" width="180" height="30" rx="15" fill="#000000" fill-opacity="0.6" />
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">СТРАТЕГИЧЕСКИЙ СТОЛ</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">20 собственников в обсуждении точек роста</text>
  </g>

  <!-- Top Right: Individual Business Breakdown Session -->
  <g transform="translate(620, 40)">
    <rect width="540" height="340" rx="16" fill="#0C1D33" stroke="url(#photoBorder)" stroke-width="1.5" />
    <!-- Whiteboard diagram representation -->
    <rect x="120" y="80" width="300" height="150" rx="10" fill="#061220" stroke="#1E3A5F" stroke-width="1" />
    <line x1="160" y1="180" x2="220" y2="130" stroke="#E06D2B" stroke-width="3" />
    <line x1="220" y1="130" x2="300" y2="150" stroke="#E06D2B" stroke-width="3" />
    <line x1="300" y1="150" x2="380" y2="100" stroke="#10B981" stroke-width="4" />
    <circle cx="380" cy="100" r="6" fill="#10B981" />
    
    <!-- Tag -->
    <rect x="20" y="20" width="160" height="30" rx="15" fill="#000000" fill-opacity="0.6" />
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E06D2B">ЖИВОЙ РАЗБОР</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Индивидуальный аудит оффера и воронки</text>
  </g>

  <!-- Bottom Left: High-Ticket Deal Case Study -->
  <g transform="translate(40, 420)">
    <rect width="540" height="340" rx="16" fill="#0C1D33" stroke="#1E3A5F" stroke-width="1.5" />
    
    <g transform="translate(40, 60)">
      <text x="0" y="40" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#34D399">$250,000</text>
      <text x="0" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Крупнейшая закрытая сделка</text>
      <text x="0" y="110" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Ниша: премиальная недвижимость и B2B сервис в ОАЭ</text>
      <text x="0" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Срок внедрения рекомендаций: 24 дня после завтрака</text>
    </g>

    <rect x="20" y="20" width="180" height="30" rx="15" fill="#000000" fill-opacity="0.6" />
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">РЕЗУЛЬТАТ КЕЙСА</text>
  </g>

  <!-- Bottom Right: Dubai Morning Networking & Coffee -->
  <g transform="translate(620, 420)">
    <rect width="540" height="340" rx="16" fill="#0C1D33" stroke="#1E3A5F" stroke-width="1.5" />
    
    <!-- Skyline silhouette with glowing sun -->
    <ellipse cx="270" cy="200" rx="180" ry="50" fill="#E06D2B" opacity="0.3" filter="blur(20px)" />
    <polygon points="250,90 270,90 275,220 245,220" fill="#0B1B2F" />
    
    <rect x="20" y="20" width="180" height="30" rx="15" fill="#000000" fill-opacity="0.6" />
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">DOWNTOWN DUBAI</text>
    <text x="20" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">Видовой зал с панорамой Дубая · Кофе и завтрак</text>
  </g>
</svg>
